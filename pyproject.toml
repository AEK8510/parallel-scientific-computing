[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-scientific-computing"
version = "0.1.0"
description = "Reproducible Python benchmarks for sequential, vectorized, and multiprocessing scientific workloads."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Ahmed El Kerim"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
